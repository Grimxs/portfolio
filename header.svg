<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080811" />
      <stop offset="50%" stop-color="#0f0f1f" />
      <stop offset="100%" stop-color="#18132b" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Ambient Orbs -->
    <radialGradient id="orb1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Glowing Orbs -->
  <rect width="1200" height="320" rx="20" fill="url(#orb1)" />
  <rect width="1200" height="320" rx="20" fill="url(#orb2)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="100" y1="0" x2="100" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="300" y1="0" x2="300" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="500" y1="0" x2="500" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="700" y1="0" x2="700" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="900" y1="0" x2="900" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
    <line x1="1100" y1="0" x2="1100" y2="320" />
  </g>

  <!-- Status Pill -->
  <g transform="translate(600, 50)">
    <rect x="-150" y="-15" width="300" height="30" rx="15" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
    <circle cx="-120" cy="0" r="4.5" fill="#10b981" />
    <text x="-105" y="4.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#34d399" letter-spacing="0.5">AVAILABLE FOR PROJECTS</text>
  </g>

  <!-- Main Name Title -->
  <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
    MELWIN DAVE D. ABE
  </text>

  <!-- Gradient Role Subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="url(#neonGrad)" letter-spacing="1">
    FULL-STACK DEVELOPER &amp; SOFTWARE ENGINEER
  </text>

  <!-- Tagline -->
  <text x="600" y="245" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14.5" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    Vue.js 3 • PHP Laravel • TypeScript • RESTful APIs • Scalable Web Architecture
  </text>

  <!-- Bottom Accent Bar -->
  <rect x="450" y="275" width="300" height="3" rx="1.5" fill="url(#neonGrad)" filter="url(#glow)" />
</svg>
